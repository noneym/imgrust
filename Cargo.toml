[package]
name = "imgrust"
version = "0.3.0"
edition = "2021"
description = "Fast image processing proxy with S3 sources, S3-backed result cache and animated WebP support"
repository = "https://github.com/noneym/imgrust"
homepage = "https://imgrust.com"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
moka = { version = "0.12", features = ["future"] }
bytes = "1.9"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
percent-encoding = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
pkg-config = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
